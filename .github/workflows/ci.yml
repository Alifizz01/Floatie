name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test Floatie.sln -c Release --logger "console;verbosity=normal"

      - name: Publish (single exe, no .NET install needed)
        run: >
          dotnet publish src/Floatie -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/Floatie.exe, README.md, LICENSE -DestinationPath Floatie-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Floatie-win-x64
          path: Floatie-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Floatie-win-x64.zip
          generate_release_notes: true
